apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-fastapi
spec:
  replicas: {{ .Values.fastapi.replicas }}
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: "{{ .Values.fastapi.image }}:{{ .Values.fastapi.tag }}"
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.fastapi.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.fastapi.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.fastapi.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
